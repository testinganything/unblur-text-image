name: Unblur Text Image
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct URL to the blurry image (PNG/JPG)'
        required: true
        type: string

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install opencv-python-headless pillow numpy requests

      - name: Download + enhance
        run: |
          python - << 'EOF'
          import cv2, numpy as np, requests, sys, time, subprocess, os

          url = "${{ github.event.inputs.image_url }}"
          print(f"Downloading: {url}")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://catbox.moe/",
          }

          content = None
          last_err = None

          # Try requests with retries + browser headers
          for attempt in range(4):
              try:
                  r = requests.get(url, headers=headers, timeout=90, allow_redirects=True)
                  r.raise_for_status()
                  content = r.content
                  print(f"Downloaded with requests ({len(content)} bytes)")
                  break
              except Exception as e:
                  last_err = e
                  print(f"requests attempt {attempt+1} failed: {e}")
                  time.sleep(2 + attempt)

          # Fallback to curl (often works when requests is blocked)
          if content is None:
              print("Falling back to curl...")
              try:
                  result = subprocess.run(
                      ["curl", "-L", "-A", headers["User-Agent"], "-H", "Accept: image/*,*/*",
                       "-H", "Referer: https://catbox.moe/", "--fail", "--silent", "--show-error",
                       "-o", "downloaded.bin", url],
                      capture_output=True, text=True, timeout=90
                  )
                  if result.returncode == 0 and os.path.exists("downloaded.bin"):
                      with open("downloaded.bin", "rb") as f:
                          content = f.read()
                      print(f"Downloaded with curl ({len(content)} bytes)")
                  else:
                      print("curl stderr:", result.stderr)
              except Exception as e:
                  last_err = e
                  print(f"curl failed: {e}")

          if content is None or len(content) < 100:
              raise SystemExit(f"Could not download image. Last error: {last_err}")

          img_array = np.frombuffer(content, np.uint8)
          img = cv2.imdecode(img_array, cv2.IMREAD_GRAYSCALE)
          if img is None:
              # try color then convert
              img_color = cv2.imdecode(img_array, cv2.IMREAD_COLOR)
              if img_color is None:
                  raise SystemExit("Failed to decode image – check that the URL points to a valid image file")
              img = cv2.cvtColor(img_color, cv2.COLOR_BGR2GRAY)

          print(f"Image size: {img.shape[1]}x{img.shape[0]}")

          # Denoise
          den = cv2.fastNlMeansDenoising(img, h=8)
          # Contrast enhancement
          clahe = cv2.createCLAHE(clipLimit=2.5, tileGridSize=(8,8))
          enh = clahe.apply(den)
          # Unsharp mask
          blur = cv2.GaussianBlur(enh, (0,0), 1.5)
          sharp = cv2.addWeighted(enh, 1.8, blur, -0.8, 0)
          # Binary threshold for clean black text on white
          _, bin_img = cv2.threshold(sharp, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)
          cv2.imwrite("unblurred.png", bin_img)
          print("Done → unblurred.png")
          EOF

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: unblurred-image
          path: unblurred.png
