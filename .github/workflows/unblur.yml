name: Unblur Text Image (Advanced)
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct URL to the blurry image (PNG/JPG)'
        required: true
        type: string

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install opencv-python-headless pillow numpy requests onnxruntime

      - name: Download NAFNet model + process image
        run: |
          python - << 'EOF'
          import cv2
          import numpy as np
          import requests
          import time
          import subprocess
          import os
          import onnxruntime as ort

          def download(url, out_path=None, referer="https://huggingface.co/"):
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
                  "Accept": "*/*",
                  "Referer": referer,
              }
              content = None
              last_err = None
              for attempt in range(5):
                  try:
                      r = requests.get(url, headers=headers, timeout=120, allow_redirects=True, stream=True)
                      r.raise_for_status()
                      content = r.content
                      print(f"Downloaded {url} → {len(content)} bytes")
                      break
                  except Exception as e:
                      last_err = e
                      print(f"attempt {attempt+1} failed: {e}")
                      time.sleep(3 + attempt)
              if content is None:
                  print("Falling back to curl...")
                  tmp = out_path or "tmp.bin"
                  result = subprocess.run(
                      ["curl", "-L", "-A", headers["User-Agent"], "-H", f"Referer: {referer}",
                       "--fail", "--silent", "--show-error", "-o", tmp, url],
                      capture_output=True, text=True, timeout=180
                  )
                  if result.returncode == 0 and os.path.exists(tmp):
                      with open(tmp, "rb") as f:
                          content = f.read()
                      print(f"curl ok → {len(content)} bytes")
                  else:
                      print(result.stderr)
                      raise SystemExit(f"Download failed: {last_err}")
              if out_path:
                  with open(out_path, "wb") as f:
                      f.write(content)
              return content

          # ---------- 1. Download input image ----------
          img_url = "${{ github.event.inputs.image_url }}"
          print("=== Downloading input image ===")
          img_bytes = download(img_url, referer="https://catbox.moe/")
          arr = np.frombuffer(img_bytes, np.uint8)
          img_bgr = cv2.imdecode(arr, cv2.IMREAD_COLOR)
          if img_bgr is None:
              raise SystemExit("Cannot decode input image")
          h0, w0 = img_bgr.shape[:2]
          print(f"Original size: {w0}x{h0}")

          # ---------- 2. Force safe size for NAFNet ----------
          # This particular ONNX export breaks on small heights.
          # Pad to at least 512x512 (white background) and make multiple of 32.
          TARGET = 512
          MULTIPLE = 32

          # Create a white canvas of TARGET x TARGET (or larger if image is bigger)
          canvas_h = max(TARGET, ((h0 + MULTIPLE - 1) // MULTIPLE) * MULTIPLE)
          canvas_w = max(TARGET, ((w0 + MULTIPLE - 1) // MULTIPLE) * MULTIPLE)
          # Keep aspect roughly, but guarantee both sides >= TARGET and multiple of 32
          canvas_h = max(canvas_h, TARGET)
          canvas_w = max(canvas_w, TARGET)
          canvas_h = ((canvas_h + MULTIPLE - 1) // MULTIPLE) * MULTIPLE
          canvas_w = ((canvas_w + MULTIPLE - 1) // MULTIPLE) * MULTIPLE

          canvas = np.full((canvas_h, canvas_w, 3), 255, dtype=np.uint8)

          # Center the original image
          y0 = (canvas_h - h0) // 2
          x0 = (canvas_w - w0) // 2
          canvas[y0:y0+h0, x0:x0+w0] = img_bgr
          print(f"Padded canvas: {canvas_w}x{canvas_h} (original placed at {x0},{y0})")

          work = canvas

          # ---------- 3. Download NAFNet ONNX ----------
          model_path = "nafnet.onnx"
          if not os.path.exists(model_path):
              print("=== Downloading NAFNet model (~92 MB) ===")
              model_url = "https://huggingface.co/opencv/deblurring_nafnet/resolve/main/deblurring_nafnet_2025may.onnx"
              download(model_url, out_path=model_path)

          # ---------- 4. Neural deblurring ----------
          print("=== Running NAFNet deblur (CPU) ===")
          # Suppress some onnxruntime warnings
          so = ort.SessionOptions()
          so.log_severity_level = 3
          session = ort.InferenceSession(model_path, sess_options=so, providers=["CPUExecutionProvider"])
          input_name = session.get_inputs()[0].name

          img_rgb = cv2.cvtColor(work, cv2.COLOR_BGR2RGB).astype(np.float32) / 255.0
          blob = np.transpose(img_rgb, (2, 0, 1))[None, ...]  # 1x3xHxW

          out = session.run(None, {input_name: blob})[0]
          out = out[0]  # 3xHxW
          out = np.transpose(out, (1, 2, 0))
          out = np.clip(out * 255.0, 0, 255).astype(np.uint8)
          deblurred_full = cv2.cvtColor(out, cv2.COLOR_RGB2BGR)

          # Crop back to original content
          deblurred = deblurred_full[y0:y0+h0, x0:x0+w0]

          if deblurred.shape[0] != h0 or deblurred.shape[1] != w0:
              deblurred = cv2.resize(deblurred, (w0, h0), interpolation=cv2.INTER_LANCZOS4)

          cv2.imwrite("deblurred_color.png", deblurred)
          print("Saved deblurred_color.png")

          # ---------- 5. Text-optimized post-process ----------
          gray = cv2.cvtColor(deblurred, cv2.COLOR_BGR2GRAY)

          den = cv2.fastNlMeansDenoising(gray, h=5)
          clahe = cv2.createCLAHE(clipLimit=3.5, tileGridSize=(8, 8))
          enh = clahe.apply(den)

          # Unsharp
          blur = cv2.GaussianBlur(enh, (0, 0), 1.0)
          sharp = cv2.addWeighted(enh, 2.2, blur, -1.2, 0)

          # Adaptive threshold
          binary = cv2.adaptiveThreshold(
              sharp, 255, cv2.ADAPTIVE_THRESH_GAUSSIAN_C,
              cv2.THRESH_BINARY, 25, 10
          )

          # Light morphology
          kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (1, 1))
          binary = cv2.morphologyEx(binary, cv2.MORPH_OPEN, kernel, iterations=1)

          cv2.imwrite("unblurred_text.png", binary)
          print("Saved unblurred_text.png")

          cv2.imwrite("unblurred_gray.png", sharp)
          print("Saved unblurred_gray.png")

          print("=== All done ===")
          EOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: unblurred-results
          path: |
            deblurred_color.png
            unblurred_text.png
            unblurred_gray.png
